name: Build and Test

on:
 push:
  branches: [main]
 pull_request:
  branches: [main]

permissions:
 contents: read

jobs:
 build-and-test:
  runs-on: ubuntu-latest

  steps:
   - uses: actions/checkout@v3

   - name: Setup .NET
     uses: actions/setup-dotnet@v3
     with:
      dotnet-version: 10.0

   - name: Build
     run: dotnet build RDCore.slnx --configuration Release

   - name: Test
     run: dotnet test RDCore.slnx --configuration Release --no-build --verbosity normal
